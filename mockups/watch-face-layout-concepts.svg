<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560">
  <defs>
    <style>
      .page { fill: #080b10; }
      .title { fill: #f7fbff; font: 700 26px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .note { fill: #9aa8b8; font: 500 14px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .label { fill: #dfe8f4; font: 700 16px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .watchCase { fill: #141922; stroke: #2d3440; stroke-width: 12; }
      .face { fill: #020305; stroke: #2c3440; stroke-width: 2; }
      .ring { fill: none; stroke: #1e2630; stroke-width: 1; }
      .arcBlue { fill: none; stroke: #27b8ff; stroke-width: 5; stroke-linecap: round; }
      .arcGreen { fill: none; stroke: #45df82; stroke-width: 6; stroke-linecap: round; }
      .arcWhite { fill: none; stroke: #eff7ff; stroke-opacity: 0.42; stroke-width: 6; stroke-linecap: round; }
      .time { fill: #fbfbff; font: 800 58px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .timeSmall { fill: #fbfbff; font: 800 48px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .timeSide { fill: #fbfbff; font: 800 42px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .date { fill: #7ed7ff; font: 800 16px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .dateSmall { fill: #7ed7ff; font: 800 12px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .metric { fill: #f9fbff; font: 800 16px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .metricSmall { fill: #f9fbff; font: 800 12px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .caption { fill: #758397; font: 700 9px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .muted { fill: #647184; font: 700 10px Inter, system-ui, sans-serif; letter-spacing: 0; }
      .chip { fill: #071018; stroke: #223142; stroke-width: 1.5; }
      .chipBright { fill: #082018; stroke: #45df82; stroke-opacity: 0.65; stroke-width: 1.5; }
      .icon { fill: #7ed7ff; font: 800 13px Inter, system-ui, sans-serif; letter-spacing: 0; }
    </style>
    <clipPath id="clipA"><circle cx="210" cy="295" r="150"/></clipPath>
    <clipPath id="clipB"><circle cx="630" cy="295" r="150"/></clipPath>
    <clipPath id="clipC"><circle cx="1050" cy="295" r="150"/></clipPath>
    <g id="miniIdo">
      <circle cx="0" cy="0" r="38" fill="#58cfff"/>
      <path d="M -36 16 C -20 35 23 34 37 12 L 38 38 L -38 38 Z" fill="#7ed35b"/>
      <path d="M -28 -6 L -17 -9 L -12 23 L -22 25 Z" fill="#f1ad70"/>
      <path d="M 25 -6 L 35 -1 L 22 24 L 14 20 Z" fill="#f1ad70"/>
      <path d="M 21 -22 C 35 -7 38 3 40 12" fill="none" stroke="#f1ad70" stroke-width="8" stroke-linecap="round"/>
      <path d="M 39 12 L 47 4" fill="none" stroke="#f1ad70" stroke-width="6" stroke-linecap="round"/>
      <path d="M -18 -7 L 18 -7 L 25 27 L -24 27 Z" fill="#bbef43"/>
      <path d="M -13 -5 L -6 25 M 9 -5 L 4 26" fill="none" stroke="#1d6d8d" stroke-width="5" stroke-linecap="round"/>
      <circle cx="0" cy="-25" r="17" fill="#f3b476"/>
      <path d="M -18 -29 C -12 -46 12 -46 18 -29" fill="#f9fbff"/>
      <path d="M -17 -32 C -7 -45 10 -45 18 -31 L 13 -37 C 5 -42 -7 -41 -14 -35 Z" fill="#11151a"/>
      <rect x="-15" y="-27" width="30" height="8" rx="4" fill="#11151a"/>
      <circle cx="-8" cy="-23" r="5" fill="#0b0e13"/>
      <circle cx="8" cy="-23" r="5" fill="#0b0e13"/>
      <path d="M -8 -13 C -3 -8 6 -8 11 -13" fill="none" stroke="#11151a" stroke-width="3" stroke-linecap="round"/>
      <path d="M -19 28 L -28 45 M 16 28 L 27 45" stroke="#151a21" stroke-width="10" stroke-linecap="round"/>
      <path d="M -30 46 L -18 48 M 25 46 L 37 48" stroke="#ff5fa8" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect class="page" width="1260" height="560"/>
  <text x="48" y="56" class="title">Mini Me watch-face layout directions</text>
  <text x="48" y="83" class="note">All three shrink the time and make steps subordinate. The main choice is where the visible data lives.</text>

  <text x="210" y="128" text-anchor="middle" class="label">A. Shared stage</text>
  <text x="630" y="128" text-anchor="middle" class="label">B. Right data rail</text>
  <text x="1050" y="128" text-anchor="middle" class="label">C. Avatar-first</text>

  <!-- A -->
  <circle cx="210" cy="295" r="164" class="watchCase"/>
  <circle cx="210" cy="295" r="150" class="face"/>
  <circle cx="210" cy="295" r="128" class="ring"/>
  <path d="M 87 364 A 142 142 0 0 1 333 364" class="arcWhite"/>
  <path d="M 94 359 A 134 134 0 0 1 184 170" class="arcBlue"/>
  <path d="M 236 418 A 134 134 0 0 1 333 359" class="arcGreen"/>
  <text x="210" y="204" text-anchor="middle" class="date">30 MAY</text>
  <text x="210" y="265" text-anchor="middle" class="timeSmall">19:16</text>
  <circle cx="210" cy="305" r="56" fill="#112030" stroke="#37c8ff" stroke-width="2"/>
  <use href="#miniIdo" transform="translate(210 309) scale(1.18)"/>
  <text x="210" y="392" text-anchor="middle" class="metricSmall">0 / 5000</text>
  <text x="210" y="407" text-anchor="middle" class="caption">STEPS</text>
  <text x="210" y="481" text-anchor="middle" class="note">Balanced. Familiar, least risky.</text>

  <!-- B -->
  <circle cx="630" cy="295" r="164" class="watchCase"/>
  <circle cx="630" cy="295" r="150" class="face"/>
  <circle cx="630" cy="295" r="128" class="ring"/>
  <path d="M 505 371 A 143 143 0 0 1 751 371" class="arcBlue"/>
  <text x="580" y="209" text-anchor="middle" class="dateSmall">30 MAY</text>
  <text x="579" y="263" text-anchor="middle" class="time">19:16</text>
  <circle cx="590" cy="304" r="64" fill="#102235" stroke="#27b8ff" stroke-width="2"/>
  <use href="#miniIdo" transform="translate(590 309) scale(1.35)"/>
  <rect x="697" y="201" width="70" height="36" rx="18" class="chip"/>
  <text x="711" y="224" class="icon">sun</text>
  <text x="752" y="224" text-anchor="end" class="metricSmall">24</text>
  <rect x="698" y="263" width="76" height="40" rx="20" class="chipBright"/>
  <text x="711" y="288" class="icon">run</text>
  <text x="760" y="288" text-anchor="end" class="metricSmall">40.5</text>
  <rect x="693" y="330" width="86" height="38" rx="19" class="chip"/>
  <text x="707" y="354" class="icon">steps</text>
  <text x="766" y="354" text-anchor="end" class="metricSmall">0/5k</text>
  <text x="630" y="481" text-anchor="middle" class="note">Clean center. Best fit for more data.</text>

  <!-- C -->
  <circle cx="1050" cy="295" r="164" class="watchCase"/>
  <circle cx="1050" cy="295" r="150" fill="#06120a" stroke="#2c3440" stroke-width="2"/>
  <circle cx="1050" cy="295" r="128" class="ring"/>
  <path d="M 923 371 A 145 145 0 0 1 1177 371" class="arcWhite"/>
  <path d="M 947 390 A 118 118 0 0 1 1138 392" class="arcGreen"/>
  <text x="983" y="212" text-anchor="middle" class="dateSmall">30 MAY</text>
  <text x="987" y="265" text-anchor="middle" class="timeSide">19:16</text>
  <circle cx="1016" cy="303" r="78" fill="#153023" stroke="#45df82" stroke-width="2"/>
  <use href="#miniIdo" transform="translate(1016 310) scale(1.6)"/>
  <rect x="1111" y="204" width="80" height="36" rx="18" fill="#20b66a"/>
  <text x="1124" y="227" class="metricSmall">40.5</text>
  <text x="1178" y="227" text-anchor="end" class="caption" fill="#eafff1">KM</text>
  <rect x="1107" y="253" width="88" height="36" rx="18" fill="#f7fbff" fill-opacity="0.92"/>
  <text x="1122" y="276" fill="#123822" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800">0/5K</text>
  <text x="1180" y="276" text-anchor="end" fill="#267a4b" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="800">STEPS</text>
  <rect x="1115" y="304" width="72" height="34" rx="17" fill="#eff7ff" fill-opacity="0.86"/>
  <text x="1130" y="326" fill="#123822" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800">72</text>
  <text x="1173" y="326" text-anchor="end" fill="#267a4b" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="800">HR</text>
  <text x="1050" y="481" text-anchor="middle" class="note">Most charming. Needs careful contrast.</text>
</svg>
